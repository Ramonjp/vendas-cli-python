[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vendas-cli"
version = "0.1.0"
description = "CLI para gerar relatórios de vendas a partir de CSV"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
vendas-cli = "vendas_cli.cli:main"

[tool.setuptools]
packages = ["vendas_cli"]
